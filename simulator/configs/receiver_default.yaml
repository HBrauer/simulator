# Passthrough replay: channel 1 is dedicated to streaming a recorded capture verbatim.
# The scenario (replay_passthrough.yaml) carries one capture per bandwidth (1M / 20M / 80M).
# Channel 1 is configured for the full 80 MHz / 98.304 MS/s and streams that capture with no
# resampling; retune its bandwidth_hz + sample_rate_hz via REST (PUT /api/v1/channels/1) to
# 20 MHz / 24.576 MS/s or 1 MHz / 1.536 MS/s to select a different variant. Retuning to a
# bandwidth/rate with no matching variant renders silence -- passthrough never resamples.
schema_version: 1
instance_id: "receiver_passthrough"
scenario_file: "simulator/scenarios/default.yaml"
log_path: "logs/receiver_passthrough.log"
# 1536-sample blocks reach full real-time rate at 80 MHz; 1024 cannot (see receiver_replay_mixer.yaml).
stream_block_samples: 1536
receivers:
  - receiver_id: 0
    rest_bind_host: "127.0.0.1"
    rest_port: 8111
    # Multicast group (not unicast) so multiple receivers can view the stream at once. With a
    # unicast host, a second sdr_waterfall_receiver joining the same port silently steals the flow
    # via SO_REUSEPORT and the first goes dead; every receiver that joins a multicast group instead
    # gets its own copy (IP_MULTICAST_LOOP is set, so same-host receivers are served too).
    # udp_multicast_interface pins sends to loopback: without it the kernel may route the group over
    # a physical NIC, which cannot carry this config's ~98 MS/s stream. Receivers must join on the
    # same interface -- pass --interface 127.0.0.1 (see README "Multicast").
    udp_output_host: "239.10.10.10"
    udp_multicast_interface: "127.0.0.1"
    frequency_min_hz: 60000000
    frequency_max_hz: 140000000
    bandwidth_hz: 80000000
    scan_rate_hz_per_s: 100000000000
    # Matches the source's power_dbm exactly (with default output_scale 1.0), so passthrough
    # takes the literal-memcpy branch (gain == 1.0) instead of a scaled copy.
    rf_reference_power_dbm: -55.0
    channels:
      # Channel 0: wideband 80 MHz reference stream (tracks the tuner). Left DISABLED by default:
      # a second 80 MHz stream doubles loopback traffic to ~196 MS/s (~786 MB/s) and steals CPU
      # from the receiver, whose UDP socket buffer (net.core.rmem_max, ~208 KB by default) then
      # overflows -- observed as gaps and a receive rate well below 98.3 MS/s even though the sim
      # sends both streams cleanly (udp_send_errors=0). Enable it only if you also raise the OS
      # receive buffer (see the README note) and are viewing this channel, not channel 1.
      - channel_id: 0
        track_tuner: true
        rates:
          - { bandwidth_hz: 80000000, sample_rate_hz: 98304000 }
        # Wideband synthesis (noise floor + several signals across 80 MHz) exceeds one core, so a
        # single render thread streams below real time. Render several consecutive blocks in
        # parallel to sustain 98.304 MS/s (4 threads clears it in an optimized build, ~5 in the
        # debug build; excess threads simply idle on back-pressure once the stream is paced).
        # Only matters when this channel synthesises (tuned off the passthrough band); a
        # passthrough tune is a cheap memcpy and needs just one thread.
        render_threads: 6
        stream_enabled: false
        udp_output_port: 51100
      # Channel 1: dedicated passthrough replay at 100 MHz -- the channel this demo streams. It
      # lists all three recorded variants; the first (80 MHz) is active at load, and REST retunes
      # among them (a rate with no matching capture renders silence -- passthrough never resamples).
      - channel_id: 1
        center_frequency_hz: 100000000
        rates:
          - { bandwidth_hz: 21000000, sample_rate_hz: 24576000 }
          - { bandwidth_hz: 10000000, sample_rate_hz: 12288000 }
          - { bandwidth_hz: 5000000, sample_rate_hz: 6144000 }
          - { bandwidth_hz: 2500000, sample_rate_hz: 3072000 }
          - { bandwidth_hz: 1250000, sample_rate_hz: 1536000 }
        udp_output_port: 51101
      - channel_id: 2
        center_frequency_hz: 100000000
        rates:
          - { bandwidth_hz: 500000, sample_rate_hz: 768000 }
          - { bandwidth_hz: 300000, sample_rate_hz: 384000 }
          - { bandwidth_hz: 200000, sample_rate_hz: 256000 }
          - { bandwidth_hz: 100000, sample_rate_hz: 128000 }
          - { bandwidth_hz: 50000, sample_rate_hz: 64000 }
          - { bandwidth_hz: 30000, sample_rate_hz: 48000 }
          - { bandwidth_hz: 25000, sample_rate_hz: 32000 }
          - { bandwidth_hz: 15000, sample_rate_hz: 24000 }
          - { bandwidth_hz: 10000, sample_rate_hz: 16000 }
        # ~20 dB of digital headroom below the -55 dBm full-scale reference. The POCSAG signals in
        # default.yaml are 30 dB SNR (-48.2 dBm) -- already above the reference -- and two overlap
        # in this 500 kHz window, so at unity scale they overdrive the ADC (68% of samples railed)
        # and the hard clipping intermodulates them into a 52 kHz comb of ghost carriers across the
        # band. output_scale attenuates signal and noise together, so SNR is unchanged; it only
        # buys back the headroom the clipping needs.
        output_scale: 0.1
        udp_output_port: 51102
