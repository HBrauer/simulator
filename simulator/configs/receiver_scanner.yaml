schema_version: 1
instance_id: "receiver_scanner"
scenario_file: "simulator/scenarios/scanner_fsk.yaml"
log_path: "logs/receiver_scanner.log"
stream_block_samples: 1024
stream_cpu: -1
asset_cache_max_bytes: 0
receivers:
  - receiver_id: 0
    rest_bind_host: "127.0.0.1"
    rest_port: 8100
    udp_output_host: "127.0.0.1"
    frequency_start_hz: 9960000000
    frequency_stop_hz: 10040000000
    frontend_bandwidth_hz: 80000000
    scan_rate_hz_per_s: 100000000000
    rf_reference_power_dbm: -55.0
    profiles:
      - { bandwidth_hz: 80000000, sample_rate_hz: 98304000, name: "80M" }
      - { bandwidth_hz: 40000000, sample_rate_hz: 49152000, name: "40M" }
      - { bandwidth_hz: 20000000, sample_rate_hz: 24576000, name: "20M" }
      - { bandwidth_hz: 10000000, sample_rate_hz: 12288000, name: "10M" }
      - { bandwidth_hz: 5000000, sample_rate_hz: 6144000, name: "5M" }
      - { bandwidth_hz: 1000000, sample_rate_hz: 1536000, name: "1M" }
    channels:
      - channel_id: 0
        track_tuner: true
        bandwidth_hz: 80000000
        stream_enabled: true
        udp_output_port: 50000
      - channel_id: 1
        center_frequency_hz: 10005000000
        bandwidth_hz: 20000000
        stream_enabled: true
        udp_output_port: 50001
      - channel_id: 2
        center_frequency_hz: 10010000000
        bandwidth_hz: 20000000
        stream_enabled: true
        udp_output_port: 50002
      - channel_id: 3
        center_frequency_hz: 9995000000
        bandwidth_hz: 20000000
        stream_enabled: true
        udp_output_port: 50003
      - channel_id: 4
        center_frequency_hz: 10030000000
        bandwidth_hz: 20000000
        stream_enabled: true
        udp_output_port: 50004
