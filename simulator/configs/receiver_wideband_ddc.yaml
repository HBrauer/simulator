# Wideband recording + many narrow DDC channels: the detector use case. One 80 MHz
# track-tuner channel scans the recording (100-180 MHz), and a set of fixed narrow channels
# extract sub-bands from the same file at runtime through the multi-stage DDC cascade.
#
# Retuning a DDC channel (PUT /api/v1/channels/{id}) to a cold tune area stalls that one
# stream for the intermediate cache build (~loop-length dependent, on the order of a second),
# then streams hot; retunes near a previous tune reuse the cached intermediate immediately.
#
# Generate the demo asset first (multitone, loop length divisible by all front decimations):
#   python3 simulator/scripts/generate_sample_iq.py --pattern multitone \
#     --sample-rate 98304000 --samples 9830400 \
#     --output simulator/assets/wideband_80mhz_98304ksps.c16
schema_version: 1
instance_id: "receiver_wideband_ddc"
scenario_file: "simulator/scenarios/wideband_ddc.yaml"
log_path: "logs/receiver_wideband_ddc.log"
stream_block_samples: 1536
# Budget for precomputed DDC intermediates (ci16, one full source loop per tune area). One
# entry costs loop_seconds * intermediate_rate * 4 bytes; the 0.1 s demo loop costs at most
# ~5 MB per entry, a 60 s recording at 2.048 MS/s ~492 MB. 0 disables the cache (every block
# then runs the full-rate cascade). Default when omitted: 2 GiB.
ddc_cache_max_bytes: 2147483648
receivers:
  - receiver_id: 0
    rest_bind_host: "127.0.0.1"
    rest_port: 8120
    udp_output_host: "127.0.0.1"
    # Fixed tuner centered on the recording: 100-180 MHz span, 80 MHz front end.
    frequency_min_hz: 100000000
    frequency_max_hz: 180000000
    bandwidth_hz: 80000000
    scan_rate_hz_per_s: 0
    rf_reference_power_dbm: -55.0
    channels:
      - channel_id: 0
        track_tuner: true
        rates:
          - { bandwidth_hz: 80000000, sample_rate_hz: 98304000 }
        udp_output_port: 52000
      # 500 kHz DDCs
      - { channel_id: 1, center_frequency_hz: 104500000, rates: [ { bandwidth_hz: 500000, sample_rate_hz: 768000 } ], udp_output_port: 52001 }
      - { channel_id: 2, center_frequency_hz: 112000000, rates: [ { bandwidth_hz: 500000, sample_rate_hz: 768000 } ], udp_output_port: 52002 }
      - { channel_id: 3, center_frequency_hz: 133250000, rates: [ { bandwidth_hz: 500000, sample_rate_hz: 768000 } ], udp_output_port: 52003 }
      - { channel_id: 4, center_frequency_hz: 158000000, rates: [ { bandwidth_hz: 500000, sample_rate_hz: 768000 } ], udp_output_port: 52004 }
      - { channel_id: 5, center_frequency_hz: 176500000, rates: [ { bandwidth_hz: 500000, sample_rate_hz: 768000 } ], udp_output_port: 52005 }
      # 100 kHz DDCs (119.4 MHz is the worked example from the use case)
      - { channel_id: 6, center_frequency_hz: 119400000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52006 }
      - { channel_id: 7, center_frequency_hz: 121150000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52007 }
      - { channel_id: 8, center_frequency_hz: 127800000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52008 }
      - { channel_id: 9, center_frequency_hz: 141020000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52009 }
      - { channel_id: 10, center_frequency_hz: 149500000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52010 }
      - { channel_id: 11, center_frequency_hz: 155725000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52011 }
      - { channel_id: 12, center_frequency_hz: 163300000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52012 }
      - { channel_id: 13, center_frequency_hz: 171000000, rates: [ { bandwidth_hz: 100000, sample_rate_hz: 128000 } ], udp_output_port: 52013 }
      # 10 kHz DDCs
      - { channel_id: 14, center_frequency_hz: 106230000, rates: [ { bandwidth_hz: 10000, sample_rate_hz: 16000 } ], udp_output_port: 52014 }
      - { channel_id: 15, center_frequency_hz: 118005000, rates: [ { bandwidth_hz: 10000, sample_rate_hz: 16000 } ], udp_output_port: 52015 }
      - { channel_id: 16, center_frequency_hz: 137450000, rates: [ { bandwidth_hz: 10000, sample_rate_hz: 16000 } ], udp_output_port: 52016 }
      - { channel_id: 17, center_frequency_hz: 152370000, rates: [ { bandwidth_hz: 10000, sample_rate_hz: 16000 } ], udp_output_port: 52017 }
      - { channel_id: 18, center_frequency_hz: 169915000, rates: [ { bandwidth_hz: 10000, sample_rate_hz: 16000 } ], udp_output_port: 52018 }
      # 1 kHz DDCs (ratio 49152:1 -- the extreme end)
      - { channel_id: 19, center_frequency_hz: 111003000, rates: [ { bandwidth_hz: 1000, sample_rate_hz: 2000 } ], udp_output_port: 52019 }
      - { channel_id: 20, center_frequency_hz: 146900500, rates: [ { bandwidth_hz: 1000, sample_rate_hz: 2000 } ], udp_output_port: 52020 }
