schema_version: 1
instance_id: "sim_instance_replay_passthrough"
scenario_file: "simulator/scenarios/replay_passthrough_demo.json"
log_path: "logs/instance_replay_passthrough.log"
stream_block_samples: 1024
receivers:
  - receiver_id: 0
    rest_bind_host: "127.0.0.1"
    rest_port: 8111
    udp_output_host: "127.0.0.1"
    frequency_start_hz: 60000000
    frequency_stop_hz: 140000000
    frontend_bandwidth_hz: 80000000
    scan_rate_hz_per_s: 100000000000
    # Matches the source's power_dbm exactly (with default output_scale 1.0), so passthrough
    # takes the literal-memcpy branch (gain == 1.0) instead of a scaled copy.
    rf_reference_power_dbm: -55.0
    profiles:
      - { bandwidth_hz: 80000000, sample_rate_hz: 98304000, name: "80M" }
      # Sample rate matches the capture exactly (1.536 MS/s) -- required for the passthrough
      # fast path to engage; renderer_try_passthrough never resamples.
      - { bandwidth_hz: 1000000, sample_rate_hz: 1536000, name: "1M" }
    channels:
      - channel_id: 0
        track_tuner: true
        bandwidth_hz: 80000000
        stream_enabled: true
        udp_output_port: 51100
      - channel_id: 1
        center_frequency_hz: 100000000
        bandwidth_hz: 1000000
        stream_enabled: true
        udp_output_port: 51101
