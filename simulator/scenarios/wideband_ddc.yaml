schema_version: 1
scenario_id: wideband_ddc
description: 'One 80 MHz recording pinned at its absolute RF position (100-180 MHz, shift mode, epoch-synced loop). Narrow DDC channels extract sub-bands from it at runtime. Generate the asset with: python3 simulator/scripts/generate_sample_iq.py --pattern multitone --sample-rate 98304000 --samples 9830400 --output simulator/assets/wideband_80mhz_98304ksps.c16 (loop length divisible by every DDC front decimation).'
units:
  frequency_unit: Hz
  time_unit: s
  level_unit: dBm
sources:
- id: wideband_recording
  source_type: iq_file
  file: simulator/assets/wideband_80mhz_98304ksps.c16
  format: ci16
  byte_order: little_endian
  iq_layout: interleaved_iq
  sample_rate_hz: 98304000
  bandwidth_hz: 80000000
  center_frequency_hz: 140000000
  nominal_level_dbfs: -12.0
signals:
- signal_id: wideband_replay
  source_reference: wideband_recording
  replay_mode: shift
  center_frequency_hz: 140000000
  frequency_range:
    start_hz: 100000000
    stop_hz: 180000000
  bandwidth_hz: 80000000
  power_dbm: -55.0
